name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download private data
        run: |
          curl -H "Authorization: token ${{ secrets.DATA_ACCESS_TOKEN }}" \
          -H "Accept: application/vnd.github.v3.raw" \
          -o data/cbi_data_cleaned.json \
          "https://api.github.com/repos/informatics/PIPE-6246-CBI-R-Visualisation/contents/cbir-screening-tool/data/cbi_data_cleaned.json"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment